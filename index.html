<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市天气 · 时间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    padding: 12px;
    color: #1d1d1f;
  }

  /* 卡片宽度跟随嵌入窗口，字号用 clamp() 随宽度平滑缩放，
     窄窗口（Notion 分栏/小屏）不溢出，宽窗口也不会拉伸变形 */
  .card {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border: 1px solid #ececf0;
    border-radius: 16px;
    padding: clamp(12px, 4vw, 20px) clamp(14px, 5vw, 24px) clamp(10px, 3.5vw, 16px);
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }

  /* 主体一行三列：左=图标+地区，中=时间，右=大温度 */
  .mainrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cityline { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cityline > div { min-width: 0; }
  .w-icon { font-size: clamp(24px, 7vw, 34px); line-height: 1; }
  .city { font-size: clamp(13px, 3.4vw, 15px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .city .country { font-weight: 400; color: #8a8a8e; font-size: 0.78em; margin-left: 4px; }
  .desc { color: #8a8a8e; font-size: clamp(10px, 2.6vw, 12px); margin-top: 3px; }

  .col-mid { text-align: center; flex-shrink: 0; }
  .clock { font-size: clamp(15px, 4.5vw, 21px); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .clock .sec { font-size: 0.6em; color: #8a8a8e; }
  .date { color: #8a8a8e; font-size: clamp(9px, 2.4vw, 11px); margin-top: 2px; white-space: nowrap; }

  .temp { font-size: clamp(30px, 11vw, 54px); font-weight: 800; line-height: 1; letter-spacing: -1.5px; flex-shrink: 0; }
  .temp .deg { font-weight: 800; }
  .temp .unit { font-size: 0.28em; font-weight: 400; color: #8a8a8e; margin-left: 2px; }

  /* 分割线 + 5 天预报 */
  .divider { border: none; border-top: 1px solid #ececf0; margin: clamp(9px, 3vw, 14px) 0 clamp(6px, 2.2vw, 10px); }
  .forecast { display: flex; justify-content: space-between; }
  .day { text-align: center; flex: 1; min-width: 0; }
  .day .dow { color: #8a8a8e; font-size: clamp(9.5px, 2.6vw, 11.5px); }
  .day .d-icon { font-size: clamp(14px, 4vw, 19px); margin: 5px 0 4px; }
  .day .hl { font-size: clamp(10px, 2.8vw, 12px); font-weight: 600; }
  .day .hl .lo { color: #8a8a8e; font-weight: 500; }

  /* 底部：换城市 + 状态 */
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 11px; }
  .city-input {
    border: none;
    background: #f4f4f6;
    border-radius: 7px;
    padding: 4px 9px;
    font-size: 11px;
    color: #1d1d1f;
    width: 120px;
    max-width: 45%;
    outline: none;
  }

  /* 窗口过窄时：隐藏中间的时钟列，保证天气主体不挤压溢出 */
  @media (max-width: 340px) {
    .col-mid { display: none; }
  }
  .city-input::placeholder { color: #aeaeb2; }
  .status { font-size: 10px; color: #aeaeb2; }
  .status.error { color: #e64545; }
</style>
</head>
<body>
  <div class="card">
    <div class="mainrow">
      <div class="cityline">
        <span class="w-icon" id="wIcon">⏳</span>
        <div>
          <div class="city"><span id="cityName">--</span><span class="country" id="countryName"></span></div>
          <div class="desc" id="wDesc">加载中…</div>
        </div>
      </div>
      <div class="col-mid">
        <div class="clock"><span id="clock">--:--</span><span class="sec" id="clockSec"></span></div>
        <div class="date" id="dateLine"></div>
      </div>
      <div class="temp"><span id="wTemp">--</span><span class="deg">°</span><span class="unit">C</span></div>
    </div>

    <hr class="divider">
    <div class="forecast" id="forecast"></div>

    <div class="foot">
      <input id="cityInput" class="city-input" placeholder="切换城市，回车确认">
      <span class="status" id="status"></span>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

// WMO 天气码 → 图标 + 描述
const WMO = {
  0:  ['☀️', '晴'],            1:  ['🌤️', '大部晴朗'],
  2:  ['⛅', '局部多云'],       3:  ['☁️', '阴'],
  45: ['🌫️', '雾'],            48: ['🌫️', '冻雾'],
  51: ['🌦️', '小毛毛雨'],      53: ['🌦️', '毛毛雨'],     55: ['🌧️', '大毛毛雨'],
  56: ['🌦️', '冻毛毛雨'],      57: ['🌧️', '强冻毛毛雨'],
  61: ['🌧️', '小雨'],          63: ['🌧️', '中雨'],       65: ['🌧️', '大雨'],
  66: ['🌧️', '冻雨'],          67: ['🌧️', '强冻雨'],
  71: ['🌨️', '小雪'],          73: ['🌨️', '中雪'],       75: ['❄️', '大雪'],
  77: ['❄️', '雪粒'],
  80: ['🌦️', '小阵雨'],        81: ['🌧️', '阵雨'],       82: ['⛈️', '强阵雨'],
  85: ['🌨️', '小阵雪'],        86: ['🌨️', '大阵雪'],
  95: ['⛈️', '雷暴'],          96: ['⛈️', '雷暴伴冰雹'],  99: ['⛈️', '强雷暴伴冰雹'],
};
const wmo = c => WMO[c] || ['🌡️', '未知天气'];

const DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let state = { timezone: null };

async function loadCity(name) {
  setStatus('查询中…');
  try {
    // 1. 城市名 → 经纬度 + 时区
    const geo = await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=zh`
    ).then(r => r.json());
    const place = geo.results && geo.results[0];
    if (!place) { setStatus(`找不到城市「${name}」`, true); return; }

    // 2. 经纬度 → 当前天气 + 5 天预报
    const wx = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}` +
      `&current=temperature_2m,weather_code` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto`
    ).then(r => r.json());

    const cur = wx.current;
    const [icon, desc] = wmo(cur.weather_code);

    $('cityName').textContent = place.name;
    $('countryName').textContent = place.country ? '· ' + place.country : '';
    $('wIcon').textContent = icon;
    $('wTemp').textContent = Math.round(cur.temperature_2m);
    $('wDesc').textContent = desc;

    // 5 天预报
    $('forecast').innerHTML = wx.daily.time.map((t, i) => {
      const dow = i === 0 ? '今天' : DOW[new Date(t + 'T00:00:00').getDay()];
      const [di] = wmo(wx.daily.weather_code[i]);
      return `<div class="day">
        <div class="dow">${dow}</div>
        <div class="d-icon">${di}</div>
        <div class="hl">${Math.round(wx.daily.temperature_2m_max[i])}°<span class="lo">/${Math.round(wx.daily.temperature_2m_min[i])}°</span></div>
      </div>`;
    }).join('');

    state.timezone = wx.timezone;
    setStatus(`更新于 ${new Date().toLocaleTimeString('zh-CN')}`);
    localStorage.setItem(storeKey, name);
  } catch (e) {
    setStatus('网络请求失败，请检查网络', true);
  }
}

function setStatus(msg, isError = false) {
  $('status').textContent = msg;
  $('status').className = 'status' + (isError ? ' error' : '');
}

// 时钟：每秒按城市时区刷新
function tick() {
  if (!state.timezone) return;
  const now = new Date();
  const timeFmt = new Intl.DateTimeFormat('zh-CN', {
    timeZone: state.timezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
  const parts = Object.fromEntries(timeFmt.formatToParts(now).map(p => [p.type, p.value]));
  $('clock').textContent = `${parts.hour}:${parts.minute}`;
  $('clockSec').textContent = `:${parts.second}`;
  $('dateLine').textContent = new Intl.DateTimeFormat('zh-CN', {
    timeZone: state.timezone, month: 'long', day: 'numeric', weekday: 'long',
  }).format(now);
}
setInterval(tick, 1000);

// 城市输入
$('cityInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = e.target.value.trim();
    if (v) loadCity(v);
  }
});

// 启动：本实例上次手动选择 > URL 固定城市 > 默认北京
// id 参数区分同一页面里的多个插件实例，各自独立记住手动切换的城市，互不影响
const params = new URLSearchParams(location.search);
const storeKey = 'widget-city' + (params.get('id') ? '-' + params.get('id') : '');
const initCity = localStorage.getItem(storeKey) || params.get('city') || '北京';
loadCity(initCity);
setInterval(() => loadCity(localStorage.getItem(storeKey) || initCity), 10 * 60 * 1000); // 每 10 分钟刷新天气
</script>
</body>
</html>
