<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市天气 · 时间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    padding: 12px;
    color: #1d1d1f;
  }

  .card {
    width: 480px;
    max-width: 100%;
    background: #ffffff;
    border: 1px solid #ececf0;
    border-radius: 16px;
    padding: 20px 24px 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }

  /* 头部：城市 + 图标 */
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .city { font-size: 15px; font-weight: 700; }
  .city .country { font-weight: 400; color: #8a8a8e; font-size: 11.5px; margin-left: 4px; }
  .desc { color: #8a8a8e; font-size: 12px; margin-top: 3px; }
  .head .w-icon { font-size: 36px; line-height: 1; }

  /* 大温度 + 时间 */
  .main { display: flex; align-items: flex-end; gap: 22px; margin-top: 4px; }
  .temp { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -1.5px; }
  .temp .deg { font-weight: 800; }
  .temp .unit { font-size: 15px; font-weight: 400; color: #8a8a8e; margin-left: 2px; }
  .clockbox { padding-bottom: 6px; }
  .clock { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .clock .sec { font-size: 12.5px; color: #8a8a8e; }
  .date { color: #8a8a8e; font-size: 11px; margin-top: 2px; }

  /* 三个信息框 */
  .stats { display: flex; gap: 10px; margin-top: 13px; }
  .stat {
    flex: 1;
    background: #f4f4f6;
    border-radius: 10px;
    padding: 8px 12px 7px;
  }
  .stat .label { color: #8a8a8e; font-size: 11px; }
  .stat .value { font-size: 14px; font-weight: 700; margin-top: 3px; }

  /* 分割线 + 5 天预报 */
  .divider { border: none; border-top: 1px solid #ececf0; margin: 14px 0 10px; }
  .forecast { display: flex; justify-content: space-between; }
  .day { text-align: center; flex: 1; }
  .day .dow { color: #8a8a8e; font-size: 11.5px; }
  .day .d-icon { font-size: 19px; margin: 5px 0 4px; }
  .day .hl { font-size: 12px; font-weight: 600; }
  .day .hl .lo { color: #8a8a8e; font-weight: 500; }

  /* 底部：换城市 + 状态 */
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 11px; }
  .city-input {
    border: none;
    background: #f4f4f6;
    border-radius: 7px;
    padding: 4px 9px;
    font-size: 11px;
    color: #1d1d1f;
    width: 120px;
    outline: none;
  }
  .city-input::placeholder { color: #aeaeb2; }
  .status { font-size: 10px; color: #aeaeb2; }
  .status.error { color: #e64545; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <div class="city"><span id="cityName">--</span><span class="country" id="countryName"></span></div>
        <div class="desc" id="wDesc">加载中…</div>
      </div>
      <div class="w-icon" id="wIcon">⏳</div>
    </div>

    <div class="main">
      <div class="temp"><span id="wTemp">--</span><span class="deg">°</span><span class="unit">C</span></div>
      <div class="clockbox">
        <div class="clock"><span id="clock">--:--</span><span class="sec" id="clockSec"></span></div>
        <div class="date" id="dateLine"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">湿度</div><div class="value" id="wHumidity">--%</div></div>
      <div class="stat"><div class="label">风速</div><div class="value" id="wWind">-- km/h</div></div>
      <div class="stat"><div class="label">最高 / 最低</div><div class="value" id="wHL">--° / --°</div></div>
    </div>

    <hr class="divider">
    <div class="forecast" id="forecast"></div>

    <div class="foot">
      <input id="cityInput" class="city-input" placeholder="切换城市，回车确认">
      <span class="status" id="status"></span>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

// WMO 天气码 → 图标 + 描述
const WMO = {
  0:  ['☀️', '晴'],            1:  ['🌤️', '大部晴朗'],
  2:  ['⛅', '局部多云'],       3:  ['☁️', '阴'],
  45: ['🌫️', '雾'],            48: ['🌫️', '冻雾'],
  51: ['🌦️', '小毛毛雨'],      53: ['🌦️', '毛毛雨'],     55: ['🌧️', '大毛毛雨'],
  56: ['🌦️', '冻毛毛雨'],      57: ['🌧️', '强冻毛毛雨'],
  61: ['🌧️', '小雨'],          63: ['🌧️', '中雨'],       65: ['🌧️', '大雨'],
  66: ['🌧️', '冻雨'],          67: ['🌧️', '强冻雨'],
  71: ['🌨️', '小雪'],          73: ['🌨️', '中雪'],       75: ['❄️', '大雪'],
  77: ['❄️', '雪粒'],
  80: ['🌦️', '小阵雨'],        81: ['🌧️', '阵雨'],       82: ['⛈️', '强阵雨'],
  85: ['🌨️', '小阵雪'],        86: ['🌨️', '大阵雪'],
  95: ['⛈️', '雷暴'],          96: ['⛈️', '雷暴伴冰雹'],  99: ['⛈️', '强雷暴伴冰雹'],
};
const wmo = c => WMO[c] || ['🌡️', '未知天气'];

const DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let state = { timezone: null };

async function loadCity(name) {
  setStatus('查询中…');
  try {
    // 1. 城市名 → 经纬度 + 时区
    const geo = await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=zh`
    ).then(r => r.json());
    const place = geo.results && geo.results[0];
    if (!place) { setStatus(`找不到城市「${name}」`, true); return; }

    // 2. 经纬度 → 当前天气 + 5 天预报
    const wx = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}` +
      `&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto`
    ).then(r => r.json());

    const cur = wx.current;
    const [icon, desc] = wmo(cur.weather_code);

    $('cityName').textContent = place.name;
    $('countryName').textContent = place.country ? '· ' + place.country : '';
    $('wIcon').textContent = icon;
    $('wTemp').textContent = Math.round(cur.temperature_2m);
    $('wDesc').textContent = desc;
    $('wHumidity').textContent = cur.relative_humidity_2m + '%';
    $('wWind').textContent = Math.round(cur.wind_speed_10m) + ' km/h';
    $('wHL').textContent = `${Math.round(wx.daily.temperature_2m_max[0])}° / ${Math.round(wx.daily.temperature_2m_min[0])}°`;

    // 5 天预报
    $('forecast').innerHTML = wx.daily.time.map((t, i) => {
      const dow = i === 0 ? '今天' : DOW[new Date(t + 'T00:00:00').getDay()];
      const [di] = wmo(wx.daily.weather_code[i]);
      return `<div class="day">
        <div class="dow">${dow}</div>
        <div class="d-icon">${di}</div>
        <div class="hl">${Math.round(wx.daily.temperature_2m_max[i])}°<span class="lo">/${Math.round(wx.daily.temperature_2m_min[i])}°</span></div>
      </div>`;
    }).join('');

    state.timezone = wx.timezone;
    setStatus(`更新于 ${new Date().toLocaleTimeString('zh-CN')}`);
    localStorage.setItem('widget-city', name);
  } catch (e) {
    setStatus('网络请求失败，请检查网络', true);
  }
}

function setStatus(msg, isError = false) {
  $('status').textContent = msg;
  $('status').className = 'status' + (isError ? ' error' : '');
}

// 时钟：每秒按城市时区刷新
function tick() {
  if (!state.timezone) return;
  const now = new Date();
  const timeFmt = new Intl.DateTimeFormat('zh-CN', {
    timeZone: state.timezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
  const parts = Object.fromEntries(timeFmt.formatToParts(now).map(p => [p.type, p.value]));
  $('clock').textContent = `${parts.hour}:${parts.minute}`;
  $('clockSec').textContent = `:${parts.second}`;
  $('dateLine').textContent = new Intl.DateTimeFormat('zh-CN', {
    timeZone: state.timezone, month: 'long', day: 'numeric', weekday: 'long',
  }).format(now);
}
setInterval(tick, 1000);

// 城市输入
$('cityInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = e.target.value.trim();
    if (v) loadCity(v);
  }
});

// 启动：URL 参数 > 上次选择 > 默认北京
const initCity = new URLSearchParams(location.search).get('city')
  || localStorage.getItem('widget-city') || '北京';
loadCity(initCity);
setInterval(() => loadCity(localStorage.getItem('widget-city') || initCity), 10 * 60 * 1000); // 每 10 分钟刷新天气
</script>
</body>
</html>
